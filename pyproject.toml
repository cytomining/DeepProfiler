[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepprofiler"
version = "0.3.1"
description = "Tools for representation learning in high throughput image collections"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Juan C. Caicedo", email = "jcaicedo@broad.mit.edu" }]
keywords = ["deep learning", "image-based profiling", "microscopy", "cell painting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "comet-ml>=3.1.6",
    "efficientnet==1.1.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "tensorflow>=2.5",
    "tensorflow-addons>=0.13",
    "tqdm>=4.62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/cytomining/DeepProfiler"
Repository = "https://github.com/cytomining/DeepProfiler"
Documentation = "https://cytomining.github.io/DeepProfiler-handbook/"

[project.scripts]
deepprofiler = "deepprofiler.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["deepprofiler", "plugins"]

[tool.pytest.ini_options]
addopts = "--cov=deepprofiler -v"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
