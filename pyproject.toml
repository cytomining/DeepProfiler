[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepprofiler"
version = "0.3.1"
description = "Tools for representation learning in high throughput image collections"
readme = "README.md"
license = { text = "BSD" }
authors = [
    { name = "Juan C. Caicedo", email = "jcaicedo@broad.mit.edu" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "click>=8.1",
    "comet-ml>=3.40",
    "imagecodecs>=2024.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "tensorflow>=2.18",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/cytomining/DeepProfiler"

[project.scripts]
dp-pipe = "orchestrator.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepprofiler*", "plugins*", "scripts*", "orchestrator*"]

[tool.pytest.ini_options]
addopts = "--cov=./ -v"
